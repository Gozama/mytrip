<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Trip Planner</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("trip.theme.v1"))||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--mute:#6b6b6b;--line:#e4e0d6;--pri:#0f766e;--pri2:#ccfbf1;--warn:#b45309;--red:#dc2626;--green:#16a34a}
:root{color-scheme:light}
:root[data-theme=dark]{--bg:#14181a;--card:#1d2326;--ink:#eee;--mute:#9aa4a8;--line:#303a3e;--pri:#2dd4bf;--pri2:#0f3b38;--warn:#fbbf24;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#14181a;--card:#1d2326;--ink:#eee;--mute:#9aa4a8;--line:#303a3e;--pri:#2dd4bf;--pri2:#0f3b38;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{padding:14px 16px 6px}
h1{margin:0;font-size:20px}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme=dark] .tab.on{color:#062a27}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .tab.on{color:#062a27}}
main{display:grid;gap:12px;padding:8px 16px 40px;max-width:1200px;margin:auto}
@media(min-width:900px){main{grid-template-columns:1.1fr 1fr;align-items:start}#map{position:sticky;top:8px;height:calc(100vh - 24px)!important}}
#map{height:42vh;min-height:280px;border-radius:14px;border:1px solid var(--line);z-index:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.route{font-size:17px;font-weight:600}
.arrow{color:var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.pill{background:var(--pri2);color:var(--pri);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600}
h2{font-size:15px;margin:0 0 8px}
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.stop.sel{border-color:var(--pri);background:var(--pri2)}
.stop input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--pri);flex:none}
.stop .nm{font-weight:600}
.meta{font-size:13px;color:var(--mute)}
.stop .note{font-size:13px}
.stay{width:64px;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--bg);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:19px}
.sum span{font-size:12px;color:var(--mute)}
.tl{list-style:none;margin:8px 0 0;padding:0;border-left:3px solid var(--pri);margin-left:8px}
.tl li{padding:0 0 12px 14px;position:relative;font-size:14px}
.tl li::before{content:"";position:absolute;left:-8.5px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--pri)}
.tl .leg{color:var(--mute);font-size:13px}
.warn{color:var(--warn);font-size:13px}
button.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
textarea{width:100%;height:260px;font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
input[type=time]{padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
details summary{cursor:pointer;font-weight:600}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vgrid label{font-size:12px;color:var(--mute);display:block}
.f{width:100%;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.st{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.st a{color:var(--pri)}
.evh{font-weight:600;margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:3000;padding:16px}
#modal[hidden],#toast[hidden]{display:none}
.mbox{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;width:min(520px,100%);max-height:85vh;overflow:auto}
.res{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.res:hover{border-color:var(--pri)}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 14px;border-radius:12px;z-index:3000;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:4px 10px}
.sch{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cat{font-weight:700;margin:14px 0 2px}
.tab.add{border-style:dashed;color:var(--pri)}
.card>h2:first-child{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.card>h2:first-child::after{content:"▾";font-size:14px;opacity:.85}
.card.collapsed>h2:first-child{margin-bottom:-14px;border-radius:13px}
.card.collapsed>h2:first-child::after{content:"▸"}
.card.collapsed>*:not(h2:first-child){display:none}
body.nopanel #panel{display:none}
body.nopanel main{grid-template-columns:1fr}
body.nopanel #map{height:calc(100vh - 170px)!important;min-height:380px;position:static}
:root{--onpri:#fff}
:root[data-theme=dark]{--onpri:#062a27}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--onpri:#062a27}}
/* หัวข้อหลักของแต่ละส่วน ทำเป็นแถบสีให้เด่น */
.card>h2:first-child{margin:-14px -14px 12px;padding:10px 14px;font-size:16px;font-weight:700;letter-spacing:.2px;
  background:linear-gradient(90deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#38bdf8));color:var(--onpri);border-radius:13px 13px 0 0}
.card.hero{border-left:6px solid var(--pri)}
.card.hero .route{font-size:19px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:600}
.rc{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rc:first-of-type{border-top:0}
.ph{width:104px;height:104px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--pri2),var(--bg));display:grid;place-items:center;font-size:32px;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb{flex:1;min-width:0;font-size:14px}
.rn{font-weight:700;font-size:15px;line-height:1.3}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pri);color:var(--onpri);font-size:12px;margin-right:6px;vertical-align:1px}
.rb .meta{font-size:12px;color:var(--mute)}
.rb a{color:var(--pri)}
</style>

<body>
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
  <div>
    <h1>🗺️ Family Trip Planner</h1>
    <div class="sub">เลือกจุดแวะ แล้วระบบจะคำนวณระยะทางและเวลาให้อัตโนมัติ</div>
    <div class="sub" id="syncStat" style="color:var(--pri);font-weight:600"></div>
  </div>
  <div style="display:flex;gap:6px;flex:none">
    <button class="b" id="panelBtn" aria-label="ซ่อน/แสดงแผงด้านขวา" style="font-size:15px">📋 ซ่อนแผง</button>
    <button class="b" id="themeBtn" aria-label="สลับธีม" style="font-size:15px">☀️ สว่าง</button>
    <button class="b" id="setBtn" aria-label="ตั้งค่า" style="font-size:15px">⚙️</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<main>
  <div id="map"></div>
  <div id="panel"></div>
</main>

<footer style="text-align:center;color:var(--mute);font-size:12px;padding:0 16px 28px">เวอร์ชัน <span id="ver"></span></footer>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== ข้อมูลทริป =====================
   เริ่มต้นว่างเปล่า — กรอกกำหนดการเองในหน้าเว็บได้เลย (ปุ่ม "＋ เพิ่มวัน")
   ถ้าต้องการใส่ข้อมูลตั้งต้นในไฟล์ ให้ใช้รูปแบบนี้ (lat/lng คัดลอกจาก Google Maps):
   days: [{
     label: "", date: "2026-12-05", depart: "08:00",
     start: { name: "ชื่อต้นทาง", lat: 0, lng: 0 },
     end:   { name: "ชื่อปลายทาง", lat: 0, lng: 0 },
     stops: [{ name: "ชื่อจุดแวะ", lat: 0, lng: 0, stay: 30, note: "" }]   // stay = เวลาแวะ (นาที)
   }]
   ======================================================================== */
const DEFAULT_TRIP = { title: "", days: [] };

const APP_VER = "2026-11-25-i";
const OSRM = "https://router.project-osrm.org";
const LS = { trip: "trip.data.v1", sel: "trip.sel.v1", cache: "trip.cache.v1" };
const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;"); };
const SYNC_KEYS = new Set(["trip.data.v1", "trip.sel.v1", "trip.stay.v1", "trip.dep.v1", "trip.veh.v1"]);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
    if (SYNC_KEYS.has(k) && globalThis.__syncHook) globalThis.__syncHook();   // ส่งการเปลี่ยนแปลงไปให้กลุ่ม (ถ้าเปิดซิงก์)
  }
};

let trip = ls.get(LS.trip, DEFAULT_TRIP);
let sel = ls.get(LS.sel, {});       // { dayIndex: { stopIndex: true } }
let stays = ls.get("trip.stay.v1", {}); // override เวลาแวะ
let departs = ls.get("trip.dep.v1", {});
let cache = ls.get(LS.cache, {});
// ล้างข้อมูลตัวอย่างเก่า (เวอร์ชันก่อนหน้าที่เคยมีทริปตัวอย่างลำปาง–เชียงใหม่) ถ้ายังไม่ได้แก้ไขอะไร
try{
  const d0 = trip.days && trip.days[0];
  if (trip.days.length === 2 && d0.start.name === "พระธาตุลำปางหลวง" && d0.end.name === "วัดเกตุการาม จ.เชียงใหม่" &&
      d0.stops.length === 3 && d0.stops[0].name === "อุโมงค์ขุนตาน"){
    trip = JSON.parse(JSON.stringify(DEFAULT_TRIP)); sel = {}; stays = {}; departs = {};
    ls.set(LS.trip, trip); ls.set(LS.sel, sel); ls.set("trip.stay.v1", stays); ls.set("trip.dep.v1", departs);
  }
}catch(e){}
trip = cleanTrip(trip) || JSON.parse(JSON.stringify(DEFAULT_TRIP));
let cur = 0, tableData = null, routeData = null, reqId = 0;

/* ---------- รถและการเติมพลังงาน ---------- */
// ตัวอย่างค่าที่แสดงเป็น placeholder เท่านั้น (ไม่ได้ใส่ให้อัตโนมัติ)
const VHINT = { fuel:{ range:"เช่น 600", warn:"เช่น 100", rest:"เช่น 10" }, ev:{ range:"เช่น 350", warn:"เช่น 70", rest:"เช่น 40" } };
let veh = Object.assign({ type:"fuel", name:"", range:"", level:"", warn:"", rest:"" }, ls.get("trip.veh.v1", {}));

// วางแผนว่าจะต้องเติม/ชาร์จที่ระยะกี่เมตรของเส้นทาง
// startOverride = พลังงานที่เหลือตอนออกเดินทาง (เมตร) ถ้าไม่ระบุ ใช้ % ที่กรอก (ไม่กรอก = เต็ม)
// kp = จุดเติม/ชาร์จที่ผู้ใช้รู้แล้วบนเส้นทาง [{pos, e, pct, name, kind}] — ถึงจุดนั้นก่อนหมด ไม่ต้องแนะนำปั๊มอื่น
function planFuel(total, startOverride, kp = []){
  const full = (Number(veh.range) || 0)*1000, warnLeft = (Number(veh.warn) || 0)*1000;
  const startAvail = (startOverride != null) ? Math.min(full, Math.max(0, startOverride)) : full*(Number(veh.level) || 100)/100;
  if (!(full > 0)) return { events:[], known:[], remain:null, endAfter:null, bad:false, unset:true };
  if (warnLeft >= full) return { events:[], known:[], remain:null, endAfter:null, bad:true };
  const pts = kp.slice().sort((x, y) => x.pos - y.pos), events = [], known = [];
  let base = 0, avail = startAvail, ki = 0, remain = null, guard = 0;
  while (guard++ < 60 && events.length < 12){
    while (ki < pts.length && pts[ki].pos <= base + 1) ki++;
    const nk = pts[ki], segEnd = nk ? nk.pos : total;
    const half = nk ? (Number(nk.e.detourKm) || 0) * 500 : 0;           // ครึ่งหนึ่งของระยะอ้อมไป-กลับ (เมตร)
    const reach = avail - (segEnd - base) - half;
    const alertAt = base + Math.max(0, avail - warnLeft);
    if (reach >= warnLeft || (nk && alertAt >= segEnd && reach >= 0)){
      if (!nk){ remain = reach; break; }
      known.push({ name: nk.name, pos: nk.pos, remain: reach, pct: nk.pct, kind: nk.kind, e: nk.e, low: reach < warnLeft });
      base = nk.pos; avail = Math.min(full, full * nk.pct / 100) - half; ki++;
      continue;
    }
    const at = Math.min(alertAt, Math.max(base, segEnd - 1));
    events.push({ alertAt: at, emptyAt: base + avail, win:[at, Math.min(base + avail, segEnd)], before: nk ? nk.name : null });
    base = at; avail = full;                // สมมติว่าเติมเต็ม ณ จุดแนะนำ
  }
  const last = known[known.length - 1], endsAtKnown = last && Math.abs(last.pos - total) < 2;
  if (endsAtKnown) remain = last.remain;
  const endAfter = endsAtKnown ? avail : remain;           // พลังงานหลังเติมที่จุดสิ้นสุดวัน (ถ้ามี)
  return { events, known, remain, endAfter, full, startAvail, bad:false };
}
// ป้ายจุดเติม/ชาร์จของแต่ละจุด: p.energy = { type:"ev"|"fuel"|"both", pct, mins, detourKm, detourMin, note }
function activeEnergy(p){
  const e = p && p.energy; if (!e) return null;
  return (e.type === "both" || e.type === veh.type) ? e : null;
}
const energyPct = e => Math.min(100, Math.max(1, Number(e && e.pct) || 100));
function eb(p){
  if (!p || !p.energy) return "";
  const e = p.energy, ok = !!activeEnergy(p), ic = e.type === "ev" ? "⚡" : e.type === "fuel" ? "⛽" : "⚡⛽";
  return `<span class="pill" style="${ok ? "" : "opacity:.5"}" title="${ok ? "" : "ไม่ตรงกับประเภทรถที่ตั้งไว้"}">${ic} ${energyPct(e)}%</span>`;
}
function effStay(x){      // เวลาที่ใช้ที่จุดนี้ (นาที) รวมเวลาเติม/ชาร์จ (ซ้อนกับเวลาแวะ) และเวลาอ้อม
  const e = activeEnergy(x.p);
  let st = x.kind === "stop" ? Number(stayOf(x.idx) || 0) : x.kind === "via" ? Number(x.p.stay || 0) : 0;
  if (!e) return st;
  const mins = (x.kind === "stop" || x.kind === "via") ? (Number(e.mins) || Number(veh.rest) || 0) : 0;
  return Math.max(st, mins) + (Number(e.detourMin) || 0);
}
function seqPositions(legs){ const pos = [0]; let acc = 0; legs.forEach(l => { acc += l.distance; pos.push(acc); }); return pos; }
function refuelPoints(seq, pos){
  const out = [];
  seq.forEach((x, k) => { const e = k > 0 && activeEnergy(x.p); if (e) out.push({ pos: pos[k], e, pct: energyPct(e), name: x.p.name, kind: x.kind }); });
  return out;
}
function routePath(pts){
  const raw = routeData.geometry ? routeData.geometry.coordinates.map(c => ({ lat:c[1], lng:c[0] })) : pts;
  const out = []; let cum = 0;
  raw.forEach((p, i) => { if (i) cum += hav(raw[i-1], p); out.push({ lat:p.lat, lng:p.lng, cum }); });
  const k = cum ? routeData.distance / cum : 1;
  out.forEach(p => p.cum *= k);
  return out;
}
const pointAt = (path, d) => path.find(p => p.cum >= d) || path[path.length-1];
function samplePath(path, from, to){
  let step = 4000; if ((to-from)/step > 24) step = (to-from)/24;
  const out = []; for (let d = from; d < to; d += step) out.push(pointAt(path, d));
  out.push(pointAt(path, to)); return out;
}
async function overpass(q){
  for (const h of ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]){
    try{ const j = await fetchJSON(h + "?data=" + encodeURIComponent(q), 25000); if (j.elements) return j.elements; }catch(e){}
  }
  return null;
}
async function findStations(sp, ev, path, from, to){
  const key = "O|" + ev + "|" + sp.map(p => p.lat.toFixed(3)+","+p.lng.toFixed(3)).join(";");
  if (cache[key]) return cache[key];
  const tag = ev ? "charging_station" : "fuel";
  const q = `[out:json][timeout:25];nwr["amenity"="${tag}"](around:3000,${sp.map(p => p.lat.toFixed(5)+","+p.lng.toFixed(5)).join(",")});out center 80;`;
  const els = await overpass(q); if (!els) return null;
  const list = els.map(e => {
    const lat = e.lat ?? e.center?.lat, lng = e.lon ?? e.center?.lon; if (lat == null) return null;
    let best = null, bd = 1e12;
    for (const p of path){ const d = hav(p, { lat, lng }); if (d < bd){ bd = d; best = p; } }
    const t = e.tags || {};
    return { lat, lng, along: best.cum, off: bd, name: t.name || t["name:th"] || t.brand || t.operator || (ev ? "สถานีชาร์จ" : "ปั๊มน้ำมัน"),
             sub: [t.brand, t.operator, t.network].filter((v, i, a) => v && a.indexOf(v) === i).join(" · "), cap: t.capacity };
  }).filter(s => s && s.along >= from - 2000 && s.along <= to + 1000)
    .sort((a, b) => a.along - b.along);
  // ตัดซ้ำที่อยู่ใกล้กันมาก แล้วเก็บไม่เกิน 8 แห่ง
  const out = []; list.forEach(s => { if (!out.some(o => hav(o, s) < 80)) out.push(s); });
  cache[key] = out.slice(0, 8); try{ ls.set(LS.cache, cache); }catch(e){}
  return cache[key];
}
async function renderFuel(day, pts, plan){
  const box = $("#fuelBox"); if (!box) return;
  const my = reqId, ev = veh.type === "ev", path = routePath(pts);
  const word = ev ? "สถานีชาร์จ" : "ปั๊มน้ำมัน", ico = ev ? "🔌" : "⛽";

    html += `<div class="evh">ครั้งที่ ${i+1}${e.before ? " (ก่อนถึง " + esc(e.before) + ")" : ""}: เริ่มแนะนำที่ ~กม.ที่ ${(e.alertAt/1000).toFixed(0)} · ควร${ev?"ชาร์จ":"เติม"}ก่อน ~กม.ที่ ${(e.win[1]/1000).toFixed(0)}${e.emptyAt > routeData.distance ? "" : " (พลังงานหมด)"}</div>`;

      popup: popEl(`<b>จุดเริ่มแนะนำ${ev?"ชาร์จ":"เติมน้ำมัน"}</b><br>ครั้งที่ ${i+1} · กม.ที่ ${(e.alertAt/1000).toFixed(0)}`) });

    else if (!list.length) html += `<div class="warn">ไม่พบ${word}ในช่วงนี้ในแผนที่ OpenStreetMap — <a target="_blank" rel="noopener" href="${gm}">ลองค้นใน Google Maps</a></div>`;

        เหลือพลังงานเมื่อถึง ~${Math.max(0, Math.round((e.emptyAt - s.along)/1000))} กม.</span><br>

}

/* ---------- รูปแบบเวลา/ระยะทาง ---------- */
const fmtKm = m => (m/1000).toFixed(m < 10000 ? 1 : 0) + " กม.";
function fmtDur(sec){
  const m = Math.round(sec/60), h = Math.floor(m/60), r = m % 60;
  if (!h) return r + " นาที";
  return h + " ชม." + (r ? " " + r + " นาที" : "");
}
function addMin(hhmm, min){
  const [h, m] = hhmm.split(":").map(Number);
  let t = (h*60 + m + Math.round(min)) % 1440;
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
}

/* ---------- คำนวณเส้นทาง ---------- */
function hav(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function estimate(a, b){ const d = hav(a,b)*1.3; return { distance: d, duration: d/(55000/3600), est: true }; }
const coordStr = pts => pts.map(p => p.lng + "," + p.lat).join(";");

async function fetchJSON(url, ms = 12000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, { signal: ctl.signal }); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}

// ตารางระยะ/เวลา จากจุดหลักทุกจุด (ต้นทาง, จุดหมายหลัก, ปลายทาง) ไปยังทุกจุด (รวมจุดแวะ)
async function getTable(day){
  const mains = [day.start, ...(day.vias || []), day.end], M = mains.length, pts = [...mains, ...day.stops];
  const key = "T2|" + M + "|" + coordStr(pts);
  let T = cache[key];
  if (!T){
    try{
      const src = mains.map((_, i) => i).join(";");
      const j = await fetchJSON(`${OSRM}/table/v1/driving/${coordStr(pts)}?sources=${src}&annotations=duration,distance`);
      if (j.code !== "Ok") throw 0;
      const dist = [], dur = [];
      for (let i = 0; i < M; i++){
        dist.push([]); dur.push([]);
        for (let k = 0; k < pts.length; k++){
          const e = estimate(mains[i], pts[k]);
          dist[i].push(j.distances[i][k] ?? e.distance); dur[i].push(j.durations[i][k] ?? e.duration);
        }
      }
      T = { M, dist, dur }; cache[key] = T; try{ ls.set(LS.cache, cache); }catch(e){}
    }catch(e){
      T = { M, est:true, dist: mains.map(m => pts.map(p => estimate(m, p).distance)), dur: mains.map(m => pts.map(p => estimate(m, p).duration)) };
    }
  }
  // จุดแวะแต่ละจุดอยู่ในช่วง (leg) ไหน — ดูจากระยะอ้อมน้อยที่สุด
  T.info = day.stops.map((_, i) => {
    const k = M + i; let best = null;
    for (let l = 0; l < M-1; l++){
      const det = T.dist[l][k] + T.dist[l+1][k] - T.dist[l][l+1];
      if (!best || det < best.det) best = { leg:l, det };
    }
    return { leg: best.leg, distance: T.dist[best.leg][k], duration: T.dur[best.leg][k] };
  });
  T.base = { distance:0, duration:0 };
  for (let l = 0; l < M-1; l++){ T.base.distance += T.dist[l][l+1]; T.base.duration += T.dur[l][l+1]; }
  return T;
}

// เส้นทางจริงผ่านจุดแวะที่เลือก (เรียงตามระยะจากต้นทาง)
async function getRoute(pts){
  const key = "R|" + coordStr(pts);
  if (cache[key]) return cache[key];
  try{
    const j = await fetchJSON(`${OSRM}/route/v1/driving/${coordStr(pts)}?overview=full&geometries=geojson`);
    if (j.code !== "Ok") throw 0;
    const r = j.routes[0];
    const out = { distance: r.distance, duration: r.duration, legs: r.legs.map(l => ({ distance:l.distance, duration:l.duration })), geometry: r.geometry };
    cache[key] = out; try{ ls.set(LS.cache, cache); }catch(e){}
    return out;
  }catch(e){
    const legs = []; for (let i=0;i<pts.length-1;i++) legs.push(estimate(pts[i], pts[i+1]));
    return { distance: legs.reduce((s,l)=>s+l.distance,0), duration: legs.reduce((s,l)=>s+l.duration,0), legs, geometry: null, est: true };
  }
}

// จัดลำดับจุดของหนึ่งวัน: ต้นทาง → (จุดแวะที่เลือกในแต่ละช่วง) → จุดหมายหลัก → ... → ปลายทาง
function buildSeq(day, T, idxs){
  const picks = idxs.filter(i => day.stops[i] && T.info[i])
    .sort((a, b) => T.info[a].leg - T.info[b].leg || T.info[a].distance - T.info[b].distance);
  const mains = [day.start, ...(day.vias || []), day.end], seq = [];
  for (let l = 0; l < T.M - 1; l++){
    seq.push({ p: mains[l], kind: l === 0 ? "start" : "via" });
    picks.filter(i => T.info[i].leg === l).forEach(i => seq.push({ p: day.stops[i], kind:"stop", idx:i }));
  }
  seq.push({ p: day.end, kind:"end" });
  if (day.lodging) seq.push({ p: day.lodging, kind:"lodging" });      // ที่พักคืนนี้ (ถ้าต่างจากปลายทาง)
  return { picks, seq, pts: seq.map(x => x.p) };
}
// พลังงานที่เหลือตอนออกเดินทางของวัน i (เมตร) + คำอธิบาย
// วันแรก: ตามป้ายจุดเริ่มต้น หรือ % ที่กรอก · วันถัดไป: ตั้งเอง "เติมเต็ม"/"ต่อจากเมื่อวาน" ได้ หรืออัตโนมัติ
//   (ป้ายที่จุดเริ่มต้น → ป้ายที่ที่พักคืนก่อน → ต่อจากที่เหลือเมื่อสิ้นวันก่อน)
async function startAvailFor(i){
  const full = (Number(veh.range) || 0) * 1000, ev = veh.type === "ev", act = ev ? "ชาร์จ" : "เติม";
  if (!(full > 0)) return { avail: null, how: "" };
  const day = trip.days[i], pctOf = e => full * energyPct(e) / 100, se = activeEnergy(day.start);
  if (i === 0) return se ? { avail: pctOf(se), how: act + "ที่จุดเริ่มต้น" } : { avail: null, how: "ตาม % ที่กรอก" };
  if (day.fill === "full") return { avail: full, how: act + "เต็มตอนเช้า" };
  if (day.fill !== "keep"){
    if (se) return { avail: pctOf(se), how: act + "ที่จุดเริ่มต้น" };
    const prev = trip.days[i-1], pe = activeEnergy(prev.lodging || prev.end);
    if (pe) return { avail: pctOf(pe), how: act + "ที่ที่พักคืนก่อน" };
  }
  try{
    const prev = trip.days[i-1], T = await getTable(prev), b = buildSeq(prev, T, selectedIdx(i-1));
    const route = await getRoute(b.pts), sa = await startAvailFor(i-1);
    const pl = planFuel(route.distance, sa.avail, refuelPoints(b.seq, seqPositions(route.legs)));
    return { avail: (pl.unset || pl.bad || pl.remain == null) ? null : Math.max(0, pl.remain), how: "ต่อจากเมื่อวาน" };
  }catch(e){ return { avail: null, how: "ต่อจากเมื่อวาน" }; }
}

async function update(){
  if (!trip.days[cur] || !tableData) return;
  const my = ++reqId, day = trip.days[cur], T = tableData;
  const { picks, seq, pts } = buildSeq(day, T, selectedIdx());
  routeData = await getRoute(pts);
  if (my !== reqId) return;
  const sa = await startAvailFor(cur);
  if (my !== reqId) return;
  const plan = planFuel(routeData.distance, sa.avail, refuelPoints(seq, seqPositions(routeData.legs)));
  plan.startHow = sa.how;
  draw(day, picks, pts, seq, plan);
}

async function draw(day, picks, pts, seq, plan){

  const guest = isGuest();

  const detourKm = seq.reduce((s, x) => s + ((activeEnergy(x.p) || {}).detourKm || 0), 0);
  const lodgeLeg = day.lodging ? routeData.legs[routeData.legs.length - 1] : null;   // ช่วงปลายทาง → ที่พัก ไม่นับเป็นส่วนเพิ่ม
  const extraDist = routeData.distance - (lodgeLeg ? lodgeLeg.distance : 0) - direct.distance;
  const extraTime = routeData.duration - (lodgeLeg ? lodgeLeg.duration : 0) - direct.duration;
  const dep = departs[cur] || day.depart || "";

  // รายการจุดแวะ

    const t = T.info[i], on = picks.includes(i);

        ${T.M > 2 ? `<div class="meta">อยู่ในช่วง ${esc(mains[t.leg].name)} → ${esc(mains[t.leg+1].name)}</div>` : ""}
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}

    const st = effStay(x), en = activeEnergy(x.p);
    tl += `<li><div class="leg">🚗 ${fmtKm(leg.distance)} · ${fmtDur(leg.duration)}</div>${tm(clock)}<b>${lbl}</b> — ${esc(x.p.name)}${en ? " " + eb(x.p) : ""}`;
    if (st){ if (dep) clock = addMin(clock, st); tl += ` <span class="leg">(อยู่ ${st} นาที${dep ? " → ออก " + clock : ""})</span>`; }
    tl += `</li>`;

  if (!dep) tl += `<li class="leg" style="padding-bottom:0">ใส่ "เวลาออกเดินทาง" ด้านบน เพื่อดูเวลาถึงแต่ละจุด</li>`;

function toggle(i){
  sel[cur] = sel[cur] || {}; sel[cur][i] = !sel[cur][i];
  ls.set(LS.sel, sel); update();
}

/* ---------- แก้ไขกำหนดการ ---------- */
const saveTrip = () => ls.set(LS.trip, trip);
const place = p => ({ name: p.name, lat: +(+p.lat).toFixed(6), lng: +(+p.lng).toFixed(6) });

function remapDayKeys(obj, d){
  const out = {};
  for (const k in obj){ const n = +k; if (n < d) out[k] = obj[k]; else if (n > d) out[n-1] = obj[k]; }
  return out;
}
function remapStays(d, i){            // i = null → ลบทั้งวัน d
  const out = {};
  for (const k in stays){
    const [dd, jj] = k.split("_").map(Number);
    if (i === null){ if (dd < d) out[k] = stays[k]; else if (dd > d) out[(dd-1)+"_"+jj] = stays[k]; continue; }
    if (dd !== d || jj < i) out[k] = stays[k]; else if (jj > i) out[d+"_"+(jj-1)] = stays[k];
  }
  return out;
}
function dropStop(i){
  trip.days[cur].stops.splice(i, 1);
  const s = sel[cur] || {}, ns = {};
  for (const k in s){ const n = +k; if (n < i) ns[n] = s[k]; else if (n > i) ns[n-1] = s[k]; }
  sel[cur] = ns; stays = remapStays(cur, i);
  ls.set(LS.sel, sel); ls.set("trip.stay.v1", stays); saveTrip(); load();
}
function addStop(p, extra){
  const day = trip.days[cur];
  day.stops.push(Object.assign(place(p), { stay: 0, note: "" }, extra || {}));
  sel[cur] = sel[cur] || {}; sel[cur][day.stops.length-1] = true;
  ls.set(LS.sel, sel); saveTrip(); load();
}
function addDay(){
  const prev = trip.days[trip.days.length-1];
  let date = "";
  if (prev && prev.date){ const d = new Date(prev.date + "T00:00:00"); d.setDate(d.getDate()+1); date = d.toISOString().slice(0,10); }
  const make = (s, e) => {
    trip.days.push({ label: "", date, depart: "", start: place(s), end: place(e), vias: [], stops: [] });
    saveTrip(); recMem = {}; cur = trip.days.length-1; renderTabs(); load();
  };
  if (prev) openPicker("เลือกปลายทางของวันใหม่ (เริ่มจากที่พัก/ปลายทางของวันก่อน)", e => make(prev.lodging || prev.end, e));
  else openPicker("① เลือกจุดเริ่มต้น", s => setTimeout(() => openPicker("② เลือกปลายทาง", e => make(s, e)), 50));
}
function moveVia(j, d){
  const v = trip.days[cur].vias, k = j + d; if (!v || k < 0 || k >= v.length) return;
  [v[j], v[k]] = [v[k], v[j]]; saveTrip(); recMem = {}; load();
}
function dropVia(j){ trip.days[cur].vias.splice(j, 1); saveTrip(); recMem = {}; load(); }
function resetAll(){
  trip = JSON.parse(JSON.stringify(DEFAULT_TRIP)); sel = {}; stays = {}; departs = {}; cache = {}; recMem = {}; tableData = null;
  veh = { type:"fuel", name:"", range:"", level:"", warn:"", rest:"" };
  ls.set(LS.trip, trip); ls.set(LS.sel, sel); ls.set("trip.stay.v1", stays); ls.set("trip.dep.v1", departs);
  ls.set(LS.cache, cache); ls.set("trip.veh.v1", veh);
  cur = 0; renderTabs(); load();
}
function delDay(){
  if (!confirm("ลบกำหนดการวันนี้ทั้งวัน?")) return;
  trip.days.splice(cur, 1);
  sel = remapDayKeys(sel, cur); departs = remapDayKeys(departs, cur); stays = remapStays(cur, null);
  ls.set(LS.sel, sel); ls.set("trip.dep.v1", departs); ls.set("trip.stay.v1", stays);
  saveTrip(); recMem = {}; cur = Math.max(0, Math.min(cur, trip.days.length-1)); renderTabs(); load();
}
function act(a){
  const day = trip.days[cur];
  if (a === "start") openPicker("เลือกจุดเริ่มต้น", p => { day.start = place(p); saveTrip(); load(); });
  else if (a === "end") openPicker("เลือกปลายทาง", p => { day.end = place(p); saveTrip(); load(); });
  else if (a === "addstop") openPicker("เพิ่มจุดแวะ", p => addStop(p));
  else if (a === "lodging") openPicker("เลือกที่พักคืนนี้", p => { day.lodging = place(p); saveTrip(); recMem = {}; load(); });
  else if (a === "rmlodge"){ delete day.lodging; saveTrip(); recMem = {}; load(); }
  else if (a === "samelodge"){
    const base = trip.days[cur-1] && (trip.days[cur-1].lodging || trip.days[cur-1].end);
    if (base){ day.lodging = JSON.parse(JSON.stringify(base)); saveTrip(); recMem = {}; load(); }
  }
  else if (a === "startprev"){
    const base = trip.days[cur-1] && (trip.days[cur-1].lodging || trip.days[cur-1].end);
    if (base){ day.start = place(base); saveTrip(); load(); }
  }
  else if (a === "addvia") openPicker("เพิ่มจุดหมายหลัก (ที่ต้องไป)", p => {
    day.vias = day.vias || []; day.vias.push(Object.assign(place(p), { stay: 0, note: "" })); saveTrip(); recMem = {}; load(); });
  else if (a === "addday") addDay();
  else if (a === "delday") delDay();
}

function parseCoord(q){
  const m = q.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if (!m) return null;
  const u = q.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);       // ลิงก์ Google Maps แบบยาว
  const lat = +(u ? u[1] : m[1]), lng = +(u ? u[2] : m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  const nm = q.match(/\/place\/([^/@]+)/);
  let name = "จุดที่ระบุ"; try{ if (nm) name = decodeURIComponent(nm[1].replace(/\+/g, " ")); }catch(e){}
  return { name, lat, lng };
}
async function geocode(q){
  const c = parseCoord(q); if (c) return [Object.assign(c, { sub: c.lat + ", " + c.lng })];
  const b = trip.days[cur]?.start || { lat: 13.75, lng: 100.5 };
  try{
    const j = await fetchJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${b.lat}&lon=${b.lng}`, 10000);
    const r = (j.features || []).map(f => { const p = f.properties || {};
      return { name: p.name || p.street || q, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0],
               sub: [p.street, p.district, p.city, p.state].filter(Boolean).join(", ") }; });
    if (r.length) return r;
  }catch(e){}
  try{
    const j = await fetchJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&accept-language=th&q=${encodeURIComponent(q)}`, 10000);
    return j.map(x => ({ name: x.name || x.display_name.split(",")[0], lat:+x.lat, lng:+x.lon, sub: x.display_name }));
  }catch(e){}
  return null;
}

function catOf(k){
  const c = CATS.find(x => x.k === k);
  if (k !== "pump") return c;
  return veh.type === "ev"
    ? { k, t:"ที่ชาร์จ EV", ico:"🔌", color:"#7c3aed", g:"สถานีชาร์จรถไฟฟ้า EV charging station", sel:'nwr["amenity"="charging_station"];', fallback:"สถานีชาร์จ" }
    : { k, t:"ปั๊มน้ำมัน", ico:"⛽", color:"#d97706", g:"ปั๊มน้ำมัน", sel:'nwr["amenity"="fuel"];', fallback:"ปั๊มน้ำมัน" };
}
function project(path, lat, lng){
  let best = null, bd = 1e12;
  for (const p of path){ const d = hav(p, { lat, lng }); if (d < bd){ bd = d; best = p; } }
  return { along: best.cum, off: bd };
}
function recCenters(scope, path, day, google){
  const total = path[path.length-1].cum;
  if (/^via\d+$/.test(scope)){ const v = (day.vias || [])[+scope.slice(3)]; if (v) return { pts:[v], r:10000 }; }
  if (scope === "lodge" && day.lodging) return { pts:[day.lodging], r:10000 };
  if (scope === "dest") return { pts:[day.end], r:10000 };
  if (scope === "start") return { pts:[day.start], r:10000 };
  if (google){
    const n = Math.min(3, Math.max(1, Math.ceil(total/60000))), c = [];
    for (let j = 0; j < n; j++) c.push(pointAt(path, total*(j+.5)/n));
    return { pts:c, r: Math.min(50000, Math.max(8000, total/(2*n)*1.2)) };
  }
  const sp = samplePath(path, 0, total), step = total / Math.max(1, sp.length-1);
  return { pts:sp, r: Math.min(15000, Math.max(4000, step/1.5)) };
}
function finalize(items, scope, k){
  items.sort((a, b) => k === "pump" ? a.off - b.off : (b.score - a.score || a.off - b.off));
  if (scope === "route"){
    const near = items.filter(i => i.off <= 15000);
    items = near.concat(items.filter(i => !near.includes(i)));
  }
  const out = []; items.forEach(s => { if (!out.some(o => o.name === s.name && hav(o, s) < 300)) out.push(s); });
  return out.slice(0, 30);
}
async function gSearch(q, c, r, minRating){
  if (!googleAllowed()) throw new Error(cfgNow().on ? "ถึงเพดานการใช้เดือนนี้แล้ว" : "เจ้าของปิดการใช้ Google อยู่");
  track("search");
  const body = { textQuery:q, languageCode:"th", pageSize:20,
    locationBias:{ circle:{ center:{ latitude:c.lat, longitude:c.lng }, radius:r } } };
  if (minRating) body.minRating = minRating;
  const res = await fetch("https://places.googleapis.com/v1/places:searchText", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "X-Goog-Api-Key": gkey,
      "X-Goog-FieldMask":"places.displayName,places.rating,places.userRatingCount,places.location,places.googleMapsUri,places.formattedAddress,places.photos" },
    body: JSON.stringify(body)
  });
  const j = await res.json();

}
async function recGoogle(k, scope, path, day){
  const c = catOf(k), { pts, r } = recCenters(scope, path, day, true);
  const all = (await Promise.all(pts.map(p => gSearch(c.g, p, r, k === "pump" ? 0 : 4)))).flat(), seen = new Set(), items = [];
  all.forEach(x => {
    if (!x.location || seen.has(x.googleMapsUri)) return; seen.add(x.googleMapsUri);
    const n = x.userRatingCount || 0, rt = x.rating || 0, pr = project(path, x.location.latitude, x.location.longitude);
    const ph = x.photos && x.photos[0] && x.photos[0].name;
    items.push({ name: x.displayName?.text || "-", lat: x.location.latitude, lng: x.location.longitude, rating: rt, n,

      photo: ph ? `https://places.googleapis.com/v1/${ph}/media?maxHeightPx=300&maxWidthPx=400&key=${encodeURIComponent(gkey)}` : "",
      score: (n/(n+30))*rt + (30/(n+30))*4.0 });   // ถ่วงด้วยจำนวนรีวิว
  });

function osmScore(t){
  let s = 0;
  if (t.wikidata || t.wikipedia) s += 3;
  if (t.website || t["contact:website"]) s += 1.5;
  if (t.phone || t["contact:phone"]) s += 1;
  if (t.opening_hours) s += 1;
  if (t.image || t.wikimedia_commons) s += 1;
  if (t.cuisine) s += .5;
  if (t["name:en"]) s += .5;
  if (t.stars) s += (parseFloat(t.stars) || 0) * .5;
  return s;
}
const KEEP = ["name","name:th","name:en","brand","operator","network","capacity","wikidata","wikipedia","wikimedia_commons","image",
  "website","contact:website","phone","contact:phone","opening_hours","cuisine","stars","addr:full","addr:street","addr:city"];
const slimTags = t => { const o = {}; KEEP.forEach(k => { if (t[k] != null) o[k] = String(t[k]).slice(0, 200); }); return o; };
async function recOSM(k, scope, path, day){

    : `(around:${Math.round(r)},${pts.map(p => p.lat.toFixed(5)+","+p.lng.toFixed(5)).join(",")})`;
  const key = "REC2|" + c.k + "|" + c.sel + "|" + around;
  let els = cache[key];
  if (!els){
    const body = c.sel.split(";").filter(Boolean).map(s => s + around + ";").join("");
    els = await overpass(`[out:json][timeout:25];(${body});out center tags 250;`);
    if (!els) throw new Error("ค้นหาไม่ได้");
    els = els.map(e => ({ lat: e.lat ?? e.center?.lat, lng: e.lon ?? e.center?.lon, t: slimTags(e.tags || {}) })).filter(e => e.lat != null);
    try{ cache[key] = els; ls.set(LS.cache, cache); }catch(e){}
  }
  const items = els.map(e => {
    const pr = project(path, e.lat, e.lng), t = e.t;
    const name = t.name || t["name:th"] || (c.fallback ? (t.brand || t.operator || c.fallback) : null);
    return { name, lat: e.lat, lng: e.lng, rating: null, n: 0, along: pr.along, off: pr.off, tags: t,
      addr: t["addr:full"] || [t["addr:street"], t["addr:city"]].filter(Boolean).join(" "),
      extra: [t.cuisine && t.cuisine.replace(/;/g, ", "), t.stars && t.stars + " ดาว", t.opening_hours && "เปิด " + t.opening_hours].filter(Boolean).join(" · "),
      score: osmScore(t) }; }).filter(i => i.name);

const commonsUrl = f => "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(f.replace(/ /g, "_")) + "?width=480";
async function osmPhoto(p){

function numOrNull(v){ return (v === null || v === undefined || v === "" || !Number.isFinite(+v)) ? null : +v; }

  return { type: e.type === "ev" || e.type === "fuel" ? e.type : "both", pct: Math.min(100, Math.max(1, numOrNull(e.pct) || 100)),
    mins: numOrNull(e.mins) === null ? "" : n(e.mins, 600), detourKm: n(e.detourKm, 500), detourMin: n(e.detourMin, 600), note: str(e.note, 120) };

  const out = { name: str(p.name, 100) || "ไม่ระบุชื่อ", lat, lng }, en = cleanEnergy(p.energy);

// ล้างข้อมูลที่รับมาจากภายนอก (ไฟล์/ลิงก์/JSON) ให้เป็นรูปแบบที่ปลอดภัย

    const s = cleanPlace(d && d.start), e = cleanPlace(d && d.end); if (!s || !e) return null;
    const stops = [];

      const p = cleanPlace(x); if (!p) return null;
      p.stay = Math.max(0, numOrNull(x.stay) || 0); p.note = str(x.note, 200); stops.push(p);
    }
    const vias = [];
    for (const x of arr(d.vias).slice(0, 20)){
      const p = cleanPlace(x); if (!p) return null;
      p.stay = Math.max(0, numOrNull(x.stay) || 0); p.note = str(x.note, 200); vias.push(p);
    }
    days.push({ label: str(d.label, 60), date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : "",
      depart: /^\d{2}:\d{2}$/.test(d.depart) ? d.depart : "", fill: d.fill === "full" || d.fill === "keep" ? d.fill : "auto", start: s, end: e, vias, stops });
    if (d.lodging){ const lp = cleanPlace(d.lodging); if (lp) days[days.length-1].lodging = lp; }

}
function cleanSel(o){ const out = {}; for (const k in (o || {})){ if (!/^\d+$/.test(k) || typeof o[k] !== "object") continue; out[k] = {}; for (const j in o[k]) if (/^\d+$/.test(j)) out[k][j] = !!o[k][j]; } return out; }

function cleanVeh(v){
  if (!v) return null; const n = x => numOrNull(x) === null ? "" : Math.max(0, +x);
  return { type: v.type === "ev" ? "ev" : "fuel", name: str(v.name, 60), range: n(v.range), level: n(v.level), warn: n(v.warn), rest: n(v.rest) };
}
const planObj = withVeh => ({ app:"family-trip-planner", v:1, trip, sel, stays, departs, veh: withVeh ? veh : undefined });
function applyPlan(p, silent){
  const t = cleanTrip(p && p.trip ? p.trip : p);
  if (!t){ alert("ข้อมูลแผนทริปไม่ถูกต้อง"); return false; }
  if (!silent && trip.days.length && !confirm("นำเข้าแผนใหม่ (" + t.days.length + " วัน) แทนที่แผนปัจจุบัน?")) return false;
  trip = t; sel = p.trip ? cleanSel(p.sel) : {}; stays = p.trip ? cleanStays(p.stays) : {}; departs = p.trip ? cleanDeps(p.departs) : {};
  const v = p.trip ? cleanVeh(p.veh) : null; if (v) veh = v;

/* ---------- แชร์ร่วมกันหลายคน (ซิงก์ผ่าน Firebase Realtime Database) ---------- */
const FB_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/;
const FB_RULES = `{

}
function useNow(){
  const { ym, d } = ymd(), u = (sync ? (ctl && ctl.use && ctl.use[ym]) : localUse[ym]) || {};

function track(kind){

  if (sync){
    ctl = ctl || {}; ctl.use = ctl.use || {}; bump(ctl.use);
    const inc = { ".sv": { increment: 1 } }, body = {};
    body[ym + "/" + kind] = inc; body[ym + "/total"] = inc; body[ym + "/d" + d] = inc;
    fetch(`${sync.db}/trips/${sync.id}/ctl/use.json`, { method:"PATCH", body: JSON.stringify(body) }).catch(() => {});

const b64u = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function deriveKey(pw, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" }, km, { name:"AES-GCM", length:256 }, false, ["encrypt", "decrypt"]);
}
async function encKey(plain, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await deriveKey(pw, salt), new TextEncoder().encode(plain));
  return { v:1, s:b64u(salt), i:b64u(iv), c:b64u(ct) };
}
async function decKey(o, pw){
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(o.i) }, await deriveKey(pw, unb64(o.s)), unb64(o.c));

    const r = await fetch(`${sync.db}/trips/${sync.id}/ctl/cfg.json`, { method:"PATCH", body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);

  if ($("#gshare")){

    };

/* ---------- แผนที่ (Leaflet ฟรี หรือ Google Maps) ---------- */
let MAP = null, mapP = null, mapNote = "", mapForceOsm = false, mapPref = ls.get("trip.map.v1", "osm");
const pinHtml = (txt, color) => `<div class="pin" style="background:${color}">${txt}</div>`;
function popEl(html, bind){ const d = document.createElement("div"); d.innerHTML = html; if (bind) bind(d); return d; }

const LMap = {
  name:"leaflet",
  async init(el){
    if (!window.L) throw new Error("โหลดแผนที่ไม่ได้ (ต้องต่ออินเทอร์เน็ต)");
    this.objs = [];
    const m = this.m = L.map(el);
    m.on("click", e => onMapClick({ lat:e.latlng.lat, lng:e.latlng.lng }));
    // CARTO ตอนนี้ต้องใช้ API key (แผนที่ขึ้นลายน้ำ "API KEY REQUIRED") จึงเลิกใช้
    // OpenStreetMap ใช้ได้เมื่อเปิดจากเว็บ (https) แต่บล็อกไฟล์ที่เปิดจาก file:// (ไม่มี Referer) → กรณีนั้นใช้ Esri แทน
    const hosted = /^https?:$/.test(location.protocol);
    const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap contributors" });
    const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Tiles © Esri" });
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Tiles © Esri" });
    (hosted ? osm : esri).addTo(m);
    let failed = 0;
    osm.on("tileerror", () => { if (hosted && ++failed === 4 && m.hasLayer(osm)){ m.removeLayer(osm); esri.addTo(m); } });
    L.control.layers({ "แผนที่ถนน (OpenStreetMap)": osm, "แผนที่ถนน (Esri)": esri, "ดาวเทียม (Esri)": sat }, null, { position:"topright" }).addTo(m);
    m.setView([13, 101], 6);
    try{ new ResizeObserver(() => m.invalidateSize()).observe(el); }catch(e){}   // ขนาดกรอบแผนที่เปลี่ยนภายหลัง (มือถือหมุนจอ/แถบเบราว์เซอร์) แผนที่จะไม่ขาว
  },
  resize(){ try{ this.m.invalidateSize(); }catch(e){} },
  marker(o){
    const mk = L.marker([o.lat, o.lng], { icon: L.divIcon({ className:"", iconSize:[28,28], iconAnchor:[14,14], html: pinHtml(o.label, o.color) }), zIndexOffset: o.z || 0 }).addTo(this.m);
    if (o.popup) mk.bindPopup(o.popup);
    this.objs.push({ tag:o.tag, o:mk });
  },
  line(pts, o){
    const l = L.polyline(pts.map(p => [p.lat, p.lng]), { color:o.color, weight:o.weight, opacity:o.opacity || 1, dashArray:o.dash ? "6 8" : null }).addTo(this.m);
    this.objs.push({ tag:o.tag, o:l });
  },
  clear(tag){ this.objs = this.objs.filter(x => { if (!tag || x.tag === tag){ x.o.remove(); return false; } return true; }); },
  closePopup(){ this.m.closePopup(); },
  fit(pts){ this.m.fitBounds(pts.map(p => [p.lat, p.lng]), { padding:[30,30] }); setTimeout(() => this.m.invalidateSize(), 50); },
  view(lat, lng, z){ this.m.setView([lat, lng], z); setTimeout(() => this.m.invalidateSize(), 50); },
  setTheme(){},
  destroy(){ try{ this.m.remove(); }catch(e){} }
};

let gLoading = null, gLoadedKey = "";
function loadGoogle(){
  if (window.google && google.maps && google.maps.importLibrary){
    return gLoadedKey === gkey ? Promise.resolve() : Promise.reject(new Error("เปลี่ยน key แล้ว กรุณารีโหลดหน้าเว็บ"));
  }
  if (gLoading) return gLoading;
  gLoading = new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("โหลด Google Maps ไม่ทัน")), 15000);
    window.__gmReady = () => { clearTimeout(t); gLoadedKey = gkey; res(); };
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(gkey) + "&loading=async&language=th&callback=__gmReady";
    s.async = true; s.onerror = () => { clearTimeout(t); rej(new Error("โหลด Google Maps ไม่ได้")); };
    document.head.appendChild(s);
  });
  gLoading.catch(() => { gLoading = null; });
  return gLoading;
}
// Google แจ้งว่า key ใช้ไม่ได้ (ยังไม่เปิด API / ไม่ผูก Billing / key ผิด) → กลับไปใช้แผนที่ปกติ
window.gm_authFailure = () => {
  mapNote = "Google Maps ใช้ไม่ได้ (ตรวจว่าเปิดใช้ Maps JavaScript API และผูก Billing แล้ว) จึงใช้แผนที่ปกติแทน";
  mapForceOsm = true; switchMap();
};
const GMap = {
  name:"google",
  async init(el){
    await loadGoogle(); this.objs = [];
    const { Map, InfoWindow } = await google.maps.importLibrary("maps");
    await google.maps.importLibrary("marker");
    this.m = new Map(el, { center:{ lat:13, lng:101 }, zoom:6, mapId:"DEMO_MAP_ID", streetViewControl:false, mapTypeControl:true,
      fullscreenControl:false, clickableIcons:false, colorScheme: this.scheme() });
    this.iw = new InfoWindow();
    this.m.addListener("click", e => onMapClick({ lat:e.latLng.lat(), lng:e.latLng.lng() }));
  },
  scheme(){ return theme === "dark" ? "DARK" : theme === "auto" ? "FOLLOW_SYSTEM" : "LIGHT"; },
  resize(){ try{ google.maps.event.trigger(this.m, "resize"); }catch(e){} },
  setTheme(){ try{ this.m.setOptions({ colorScheme: this.scheme() }); }catch(e){} },
  marker(o){
    const c = document.createElement("div"); c.innerHTML = pinHtml(o.label, o.color);
    const content = c.firstChild; content.style.transform = "translateY(50%)";
    const mk = new google.maps.marker.AdvancedMarkerElement({ map:this.m, position:{ lat:o.lat, lng:o.lng }, content, zIndex:o.z || 0 });
    if (o.popup) mk.addListener("click", () => { this.iw.setContent(o.popup); this.iw.open({ map:this.m, anchor:mk }); });
    this.objs.push({ tag:o.tag, o:mk, type:"m" });
  },
  line(pts, o){
    const opts = { map:this.m, path:pts.map(p => ({ lat:p.lat, lng:p.lng })), strokeColor:o.color, strokeWeight:o.weight };
    if (o.dash){ opts.strokeOpacity = 0; opts.icons = [{ icon:{ path:"M 0,-1 0,1", strokeOpacity:1, scale:3 }, offset:"0", repeat:"14px" }]; }
    else opts.strokeOpacity = o.opacity || 1;
    this.objs.push({ tag:o.tag, o:new google.maps.Polyline(opts), type:"l" });
  },
  clear(tag){ this.objs = this.objs.filter(x => { if (!tag || x.tag === tag){ if (x.type === "m") x.o.map = null; else x.o.setMap(null); return false; } return true; }); },
  closePopup(){ this.iw.close(); },
  fit(pts){ const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend({ lat:p.lat, lng:p.lng })); this.m.fitBounds(b, 40); },
  view(lat, lng, z){ this.m.setCenter({ lat, lng }); this.m.setZoom(z); },
  destroy(){ $("#map").innerHTML = ""; }
};

async function initMap(){
  const el = $("#map"); el.innerHTML = "";
  if (mapPref === "google" && gkey && !mapForceOsm && !googleAllowed()) mapNote = "ตอนนี้ Google ปิดอยู่หรือถึงเพดานการใช้ จึงใช้แผนที่ปกติแทน";
  else if (mapPref === "google" && gkey && !mapForceOsm){
    try{ const g = Object.create(GMap); await g.init(el); MAP = g; track("map"); return true; }
    catch(e){ mapNote = "Google Maps ใช้ไม่ได้ (" + e.message + ") จึงใช้แผนที่ปกติแทน"; el.innerHTML = ""; }
  }
  try{ const l = Object.create(LMap); await l.init(el); MAP = l; return true; }
  catch(e){ MAP = null; el.innerHTML = "<div class='card'>" + esc(e.message) + "</div>"; return false; }
}
async function switchMap(){
  if (MAP){ MAP.destroy(); MAP = null; }
  mapP = initMap(); await mapP;
  const n = $("#mapnote"); if (n) n.textContent = mapNote;
  if (trip.days.length) load(); else renderEmpty();
}
function drawMapBody(day, picks, seq){
  const all = seq.map(x => x.p), T = tableData, mains = [day.start, ...(day.vias || []), day.end];
  if (routeData.geometry){
    const ll = routeData.geometry.coordinates.map(c => ({ lat:c[1], lng:c[0] }));
    MAP.line(ll, { color:"#0f766e", weight:5, opacity:.85, tag:"route" }); all.push(...ll);
  } else {
    MAP.line(seq.map(x => x.p), { color:"#0f766e", weight:4, dash:true, tag:"route" });
  }
  seq.forEach((x, k) => {
    if (x.kind === "start") MAP.marker({ lat:x.p.lat, lng:x.p.lng, label:"▶", color:"#16a34a", z:500, tag:"route", popup:popEl("<b>เริ่มต้น</b><br>" + esc(x.p.name)) });
    else if (x.kind === "end") MAP.marker({ lat:x.p.lat, lng:x.p.lng, label:"⚑", color:"#dc2626", z:500, tag:"route", popup:popEl("<b>ปลายทางสุดท้าย</b><br>" + esc(x.p.name)) });
    else if (x.kind === "lodging") MAP.marker({ lat:x.p.lat, lng:x.p.lng, label:"🛏", color:"#4f46e5", z:480, tag:"route", popup:popEl("<b>ที่พักคืนนี้</b><br>" + esc(x.p.name)) });
    else if (x.kind === "via") MAP.marker({ lat:x.p.lat, lng:x.p.lng, label:"★", color:"#9333ea", z:450, tag:"route",
      popup:popEl("<b>จุดหมายหลัก</b><br>" + esc(x.p.name) + (x.p.stay ? "<br>อยู่ " + Number(x.p.stay) + " นาที" : "")) });
  });
  day.stops.forEach((s, i) => {
    const n = picks.indexOf(i), on = n >= 0, t = T.info[i];
    MAP.marker({ lat:s.lat, lng:s.lng, label: on ? n+1 : "•", color: on ? "#2563eb" : "#8a8f94", tag:"route",
      popup: popEl(`<b>${esc(s.name)}</b><br>${T.M > 2 ? "จาก " + esc(mains[t.leg].name) + " " : ""}${fmtKm(t.distance)} · ${fmtDur(t.duration)}<br><a href="#" data-t="${i}">${on ? "เอาออก" : "เลือกจุดนี้"}</a>
        · <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">นำทาง</a>`,
        d => { const a = d.querySelector("[data-t]"); if (a) a.onclick = ev => { ev.preventDefault(); MAP.closePopup(); toggle(i); }; }) });
    all.push(s);
  });
  MAP.fit(all);
}

  if (!THEMES[t]) t = "light";

  const b = $("#themeBtn"); if (b) b.textContent = THEMES[t];

}
$("#themeBtn").onclick = () => setTheme({ light:"dark", dark:"auto", auto:"light" }[theme]);
